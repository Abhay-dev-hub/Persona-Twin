<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Persona Twin </title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --border: #2a2e37;
    --text: #e8e9ec;
    --muted: #8b8f9a;
    --accent: #5b8cff;
    --user-bubble: #2a3550;
    --assistant-bubble: #21242c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; }
  header p { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 80%;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: var(--user-bubble);
  }
  .assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
  }
  .assistant.pending { color: var(--muted); font-style: italic; }
  .error { color: #ff6b6b; }
  form {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>Persona Twin</h1>
  <p></p>
</header>

<div id="chat"></div>

<form id="form">
  <input id="input" type="text" placeholder="Type a message..." autocomplete="off" />
  <button type="submit" id="send">Send</button>
</form>

<script>
  const chatEl = document.getElementById("chat");
  const formEl = document.getElementById("form");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");

  let history = [];

  function addBubble(role, text, extraClass) {
    const div = document.createElement("div");
    div.className = `bubble ${role}${extraClass ? " " + extraClass : ""}`;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = inputEl.value.trim();
    if (!message) return;

    addBubble("user", message);
    history.push({ role: "user", content: message });
    inputEl.value = "";
    inputEl.disabled = true;
    sendEl.disabled = true;

    const pending = addBubble("assistant", "Thinking...", "pending");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history: history.slice(0, -1) }),
      });

      const data = await res.json();

      if (!res.ok) {
        pending.textContent = `Error: ${data.detail || res.statusText}`;
        pending.classList.add("error");
        pending.classList.remove("pending");
        return;
      }

      pending.textContent = data.reply;
      pending.classList.remove("pending");
      history.push({ role: "assistant", content: data.reply });
    } catch (err) {
      pending.textContent = `Network error: ${err.message}`;
      pending.classList.add("error");
      pending.classList.remove("pending");
    } finally {
      inputEl.disabled = false;
      sendEl.disabled = false;
      inputEl.focus();
    }
  });
</script>

</body>
</html>
